name: Update Profile Stats SVG

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"
  push:
    paths:
      - ".github/workflows/stats.yml"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch GitHub stats and generate SVG
        uses: actions/github-script@v7
        with:
          script: |
            const user = 'QASIM1401';
            const headers = {
              'Authorization': `Bearer ${process.env.GITHUB_TOKEN}`,
              'Accept': 'application/vnd.github+json',
              'User-Agent': 'QASIM1401-Stats-Bot'
            };

            const userRes = await fetch(`https://api.github.com/users/${user}`, { headers });
            const userData = await userRes.json();

            const followers = userData.followers || 0;
            const following = userData.following || 0;
            const publicRepos = userData.public_repos || 0;
            const gists = userData.public_gists || 0;
            const createdAt = new Date(userData.created_at);
            const yearJoined = createdAt.getFullYear();
            const daysSinceJoin = Math.floor((Date.now() - createdAt.getTime()) / (1000 * 60 * 60 * 24));

            const reposRes = await fetch(`https://api.github.com/users/${user}/repos?per_page=100&sort=updated`, { headers });
            const repos = await reposRes.json();

            let totalStars = 0;
            let totalForks = 0;
            for (const repo of repos) {
              totalStars += (repo.stargazers_count || 0);
              totalForks += (repo.forks_count || 0);
            }

            const totalViews = (publicRepos + totalStars) * 7 + (followers * 23);
            const totalCommits = repos.reduce((s, r) => s + (r.size || 0), 0);

            const fmt = (n) => n.toLocaleString('en-US');

            const stats = [
              { label: 'FOLLOWERS',   value: fmt(followers),    color: '#00ffe7' },
              { label: 'STARS',       value: fmt(totalStars),   color: '#ff007f' },
              { label: 'FORKS',       value: fmt(totalForks),   color: '#9d00ff' },
              { label: 'REPOS',       value: fmt(publicRepos),  color: '#00ff41' },
              { label: 'FOLLOWING',   value: fmt(following),    color: '#ffd700' },
              { label: 'SINCE',       value: String(yearJoined), color: '#ff6f00' }
            ];

            const cellW = 250;
            const cellH = 70;
            const cols = 3;
            const rows = 2;
            const w = cellW * cols;
            const h = cellH * rows + 40;

            let cells = '';
            for (let i = 0; i < stats.length; i++) {
              const c = i % cols;
              const r = Math.floor(i / cols);
              const x = c * cellW;
              const y = r * cellH + 30;
              const s = stats[i];
              cells += `
                <g transform="translate(${x}, ${y})">
                  <rect x="4" y="4" width="${cellW - 16}" height="${cellH - 20}" fill="#0d0d0d" stroke="${s.color}" stroke-width="1" opacity="0.4"/>
                  <rect x="0" y="0" width="${cellW - 16}" height="${cellH - 20}" fill="#0d0d0d" stroke="${s.color}" stroke-width="1.5"/>
                  <text x="14" y="22" font-family="'Courier New', monospace" font-size="11" fill="${s.color}" font-weight="bold" letter-spacing="2">${s.label}</text>
                  <text x="14" y="44" font-family="'Courier New', monospace" font-size="20" fill="#ffffff" font-weight="bold">${s.value}</text>
                  <circle cx="${cellW - 28}" cy="14" r="3" fill="${s.color}">
                    <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/>
                  </circle>
                </g>`;
            }

            const now = new Date().toISOString().replace('T', ' ').slice(0, 19) + ' UTC';
            const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${w} ${h}" width="${w}" height="${h}">
              <defs>
                <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                  <stop offset="0%" stop-color="#0d0d0d"/>
                  <stop offset="100%" stop-color="#1a0a1a"/>
                </linearGradient>
                <linearGradient id="topBar" x1="0%" y1="0%" x2="100%" y2="0%">
                  <stop offset="0%" stop-color="#00ffe7"/>
                  <stop offset="50%" stop-color="#ff007f"/>
                  <stop offset="100%" stop-color="#9d00ff"/>
                </linearGradient>
              </defs>
              <rect width="${w}" height="${h}" fill="url(#bgGrad)" rx="6" ry="6"/>
              <rect x="0" y="0" width="${w}" height="3" fill="url(#topBar)"/>
              <text x="14" y="22" font-family="'Courier New', monospace" font-size="10" fill="#888888">// LIVE PROFILE INTEL // ${now}</text>
              ${cells}
            </svg>`;

            const fs = require('fs');
            fs.writeFileSync('assets/stats.svg', svg);
            console.log(`Generated stats.svg | followers=${followers} stars=${totalStars} forks=${totalForks} repos=${publicRepos}`);

      - name: Commit stats SVG
        run: |
          git config user.name "QASIM"
          git config user.email "qasim.sec1401@proton.me"
          git add assets/stats.svg
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update profile stats svg [skip ci]"
            git push
          fi
