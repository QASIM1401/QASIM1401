<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 70" width="700" height="70">
  <defs>
    <linearGradient id="opBg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1a0a1a"/>
      <stop offset="100%" stop-color="#0d0d0d"/>
    </linearGradient>
    <linearGradient id="opBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff007f"/>
      <stop offset="50%" stop-color="#9d00ff"/>
      <stop offset="100%" stop-color="#ff007f"/>
    </linearGradient>
    <linearGradient id="opIcon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff007f"/>
      <stop offset="100%" stop-color="#9d00ff"/>
    </linearGradient>
    <radialGradient id="eyePink" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#ff007f"/>
      <stop offset="100%" stop-color="#3a0028" stop-opacity="0"/>
    </radialGradient>
    <filter id="opGlow">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="700" height="70" fill="url(#opBg)" rx="4" ry="4"/>
  <rect x="0" y="0" width="700" height="70" fill="none" stroke="url(#opBorder)" stroke-width="1.5" rx="4" ry="4"/>
  <rect x="0" y="0" width="3" height="70" fill="#ff007f"/>
  <rect x="697" y="0" width="3" height="70" fill="#ff007f"/>

  <!-- Animated hooded operator icon -->
  <g transform="translate(35, 35)" filter="url(#opGlow)">
    <!-- Hood -->
    <path d="M -10 5 Q -12 -10 0 -14 Q 12 -10 10 5 L 9 12 L -9 12 Z"
          fill="url(#opIcon)" stroke="#ff007f" stroke-width="0.6"/>
    <!-- Face shadow -->
    <ellipse cx="0" cy="2" rx="6" ry="7" fill="#0d0d0d"/>
    <!-- Glowing eyes -->
    <ellipse cx="-2.5" cy="1" rx="1.8" ry="1" fill="url(#eyePink)">
      <animate attributeName="opacity" values="0.7;1;0.7" dur="2s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="2.5" cy="1" rx="1.8" ry="1" fill="url(#eyePink)">
      <animate attributeName="opacity" values="0.7;1;0.7" dur="2s" repeatCount="indefinite"/>
    </ellipse>
    <!-- Eye cores -->
    <circle cx="-2.5" cy="1" r="0.7" fill="#ffffff"/>
    <circle cx="2.5" cy="1" r="0.7" fill="#ffffff"/>
    <!-- Pulse scan line -->
    <line x1="-9" y1="-4" x2="9" y2="-4" stroke="#ff007f" stroke-width="0.4" opacity="0.6">
      <animate attributeName="y1" values="-12;14;-12" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="y2" values="-12;14;-12" dur="3s" repeatCount="indefinite"/>
    </line>
  </g>

  <!-- Title text -->
  <text x="80" y="42" font-family="'Courier New', monospace" font-size="22" font-weight="bold" fill="#ffffff" letter-spacing="2" filter="url(#opGlow)">&gt; OPERATOR PROFILE</text>

  <!-- Subtitle -->
  <text x="80" y="58" font-family="'Courier New', monospace" font-size="9" fill="#888888" letter-spacing="3">// IDENTITY :: CLASSIFIED</text>

  <!-- Right side ID badge -->
  <g transform="translate(680, 35)">
    <text x="0" y="-6" text-anchor="end" font-family="'Courier New', monospace" font-size="9" fill="#ff007f" letter-spacing="2">ID: 1401</text>
    <text x="0" y="6" text-anchor="end" font-family="'Courier New', monospace" font-size="9" fill="#9d00ff" letter-spacing="2">CLR: 5</text>
    <text x="0" y="18" text-anchor="end" font-family="'Courier New', monospace" font-size="7" fill="#666666">// ETHICAL</text>
  </g>
</svg>
