<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 50" width="500" height="50">
  <defs>
    <linearGradient id="osBg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0d0d0d"/>
      <stop offset="100%" stop-color="#1a0a1a"/>
    </linearGradient>
    <linearGradient id="osBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff007f"/>
      <stop offset="100%" stop-color="#9d00ff"/>
    </linearGradient>
    <filter id="osGlow">
      <feGaussianBlur stdDeviation="1" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect x="0" y="0" width="500" height="50" fill="url(#osBg)" rx="3" ry="3"/>
  <rect x="0" y="0" width="500" height="50" fill="none" stroke="url(#osBorder)" stroke-width="1" rx="3" ry="3"/>
  <rect x="0" y="0" width="2" height="50" fill="#ff007f"/>

  <!-- Tux/Linux icon -->
  <g transform="translate(15, 25)" filter="url(#osGlow)">
    <ellipse cx="0" cy="-2" rx="6" ry="7" fill="#ff007f" stroke="#ff007f" stroke-width="0.5"/>
    <ellipse cx="-2" cy="-4" rx="1.2" ry="1.5" fill="#0d0d0d"/>
    <ellipse cx="2" cy="-4" rx="1.2" ry="1.5" fill="#0d0d0d"/>
    <path d="M -2 0 Q 0 2 2 0" stroke="#0d0d0d" stroke-width="0.8" fill="none" stroke-linecap="round"/>
    <path d="M -7 5 L -9 9 M 7 5 L 9 9" stroke="#ff007f" stroke-width="2" stroke-linecap="round"/>
    <ellipse cx="-5" cy="2" rx="1.5" ry="2" fill="#ff007f" opacity="0.7"/>
    <ellipse cx="5" cy="2" rx="1.5" ry="2" fill="#ff007f" opacity="0.7"/>
  </g>

  <!-- Title -->
  <text x="60" y="30" font-family="'Courier New', monospace" font-size="16" font-weight="bold" fill="#ffffff" letter-spacing="3" filter="url(#osGlow)">PLATFORMS &amp; OS</text>

  <!-- Right side count -->
  <text x="485" y="30" text-anchor="end" font-family="'Courier New', monospace" font-size="10" fill="#9d00ff" letter-spacing="2">[ 03 ]</text>
</svg>
