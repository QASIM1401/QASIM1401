<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 50" width="500" height="50">
  <defs>
    <linearGradient id="langBg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0d0d0d"/>
      <stop offset="100%" stop-color="#0a1a1a"/>
    </linearGradient>
    <linearGradient id="langBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00ffe7"/>
      <stop offset="100%" stop-color="#00ff41"/>
    </linearGradient>
    <filter id="langGlow">
      <feGaussianBlur stdDeviation="1" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect x="0" y="0" width="500" height="50" fill="url(#langBg)" rx="3" ry="3"/>
  <rect x="0" y="0" width="500" height="50" fill="none" stroke="url(#langBorder)" stroke-width="1" rx="3" ry="3"/>
  <rect x="0" y="0" width="2" height="50" fill="#00ffe7"/>

  <!-- Code icon: </> -->
  <g transform="translate(15, 25)" filter="url(#langGlow)">
    <text x="0" y="6" font-family="'Courier New', monospace" font-size="20" font-weight="bold" fill="#00ffe7">&lt;/&gt;</text>
  </g>

  <!-- Title -->
  <text x="60" y="30" font-family="'Courier New', monospace" font-size="16" font-weight="bold" fill="#ffffff" letter-spacing="3" filter="url(#langGlow)">LANGUAGES</text>

  <!-- Right side count -->
  <text x="485" y="30" text-anchor="end" font-family="'Courier New', monospace" font-size="10" fill="#00ff41" letter-spacing="2">[ 06 ]</text>
</svg>
