<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 70" width="700" height="70">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0d0d0d"/>
      <stop offset="100%" stop-color="#1a0a2e"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00ffe7"/>
      <stop offset="50%" stop-color="#ff007f"/>
      <stop offset="100%" stop-color="#9d00ff"/>
    </linearGradient>
    <linearGradient id="iconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00ffe7"/>
      <stop offset="100%" stop-color="#9d00ff"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="700" height="70" fill="url(#bgGrad)" rx="4" ry="4"/>
  <rect x="0" y="0" width="700" height="70" fill="none" stroke="url(#borderGrad)" stroke-width="1.5" rx="4" ry="4"/>
  <rect x="0" y="0" width="3" height="70" fill="#00ffe7"/>
  <rect x="697" y="0" width="3" height="70" fill="#9d00ff"/>

  <!-- Animated icon: stylized tools/wrench with code brackets -->
  <g transform="translate(20, 35)" filter="url(#glow)">
    <!-- Wrench -->
    <path d="M 8 -10 C 4 -10 1 -7 1 -3 C 1 0 3 2 5 3 L -2 12 L 0 14 L 7 5 C 8 7 10 9 13 9 C 17 9 20 6 20 2 C 20 -1 18 -3 16 -3 L 13 0 L 10 0 L 10 -3 L 13 -6 C 12 -8 10 -10 8 -10 Z"
          fill="url(#iconGrad)" stroke="#00ffe7" stroke-width="0.8"/>
    <!-- Code brackets -->
    <text x="28" y="6" font-family="'Courier New', monospace" font-size="18" font-weight="bold" fill="#00ffe7">&lt;/&gt;</text>
    <!-- Pulse dot -->
    <circle cx="78" cy="0" r="3" fill="#ff007f">
      <animate attributeName="opacity" values="1;0.2;1" dur="1.5s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Title text -->
  <text x="115" y="42" font-family="'Courier New', monospace" font-size="22" font-weight="bold" fill="#ffffff" letter-spacing="2" filter="url(#glow)">&gt; TECH ARSENAL</text>

  <!-- Subtitle -->
  <text x="115" y="58" font-family="'Courier New', monospace" font-size="9" fill="#888888" letter-spacing="3">// TOOLS &amp; TECHNOLOGIES</text>

  <!-- Right side code indicator -->
  <text x="680" y="40" text-anchor="end" font-family="'Courier New', monospace" font-size="10" fill="#9d00ff" letter-spacing="2">[ 06 ]</text>
  <text x="680" y="55" text-anchor="end" font-family="'Courier New', monospace" font-size="7" fill="#666666">ASSETS</text>
</svg>
